<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReBox - 50 Professional Charts</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Poppins:wght@400;600;800&family=Roboto+Mono&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        /* Base Reset */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #f1f5f9; font-family: 'Inter', sans-serif; padding: 40px; }
        
        .header { text-align: center; margin-bottom: 50px; font-family: 'Poppins', sans-serif; }
        .header h1 { font-size: 3rem; color: #0f172a; margin-bottom: 10px; }
        .header p { font-size: 1.2rem; color: #475569; }

        .charts-container {
            display: flex;
            flex-direction: column;
            gap: 80px;
        }

        /* The base chart container */
        .chart {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            min-height: 800px;
            border-radius: 20px;
            overflow: hidden;
            display: grid;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            position: relative;
        }

        .chart-badge {
            position: absolute;
            top: 0; left: 0;
            background: #000; color: #fff;
            padding: 10px 20px;
            font-weight: 800;
            font-size: 1.2rem;
            border-bottom-right-radius: 20px;
            z-index: 100;
        }

        /* ----------------------------------------- */
        /* 5 STRUCTURAL LAYOUTS                      */
        /* ----------------------------------------- */
        
        /* Layout 1: The Corporate Split (Sidebar + Content) */
        .layout-1 { grid-template-columns: 350px 1fr; grid-template-rows: auto 1fr; gap: 30px; }
        .layout-1 .ch-header { grid-column: 1 / -1; }
        .layout-1 .ch-sidebar { grid-column: 1 / 2; display: flex; flex-direction: column; gap: 20px; }
        .layout-1 .ch-main { grid-column: 2 / 3; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .layout-1 .ch-full { grid-column: 1 / -1; margin-top: 20px; }

        /* Layout 2: The Masonry Grid */
        .layout-2 { grid-template-columns: repeat(3, 1fr); gap: 25px; grid-auto-rows: minmax(200px, auto); }
        .layout-2 .ch-header { grid-column: span 3; }
        .layout-2 .ch-sidebar { grid-column: span 1; }
        .layout-2 .ch-main { grid-column: span 2; display: grid; gap: 25px; }
        .layout-2 .ch-full { grid-column: span 3; }

        /* Layout 3: Top-Down Dashboard */
        .layout-3 { grid-template-columns: 1fr; gap: 40px; }
        .layout-3 .ch-header { text-align: center; }
        .layout-3 .ch-sidebar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .layout-3 .ch-main { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; }
        .layout-3 .ch-full { text-align: center; }

        /* Layout 4: Asymmetric Modern */
        .layout-4 { grid-template-columns: 1fr 2fr; gap: 20px; }
        .layout-4 .ch-header { grid-column: span 2; padding-bottom: 20px; border-bottom: 2px solid; }
        .layout-4 .ch-main { display: flex; flex-direction: column; gap: 20px; }
        .layout-4 .ch-full { grid-column: span 2; }

        /* Layout 5: Hero Centric */
        .layout-5 { display: flex; flex-direction: column; gap: 30px; align-items: center; text-align: center; }
        .layout-5 .ch-sidebar, .layout-5 .ch-main { display: flex; flex-wrap: wrap; justify-content: center; gap: 20px; width: 100%; }
        .layout-5 .card { flex: 1; min-width: 300px; text-align: left; }

        /* ----------------------------------------- */
        /* 10 DESIGN THEMES                          */
        /* ----------------------------------------- */

        /* Theme 1: Clean Corporate (Blue/Grey) */
        .theme-1 { background: #ffffff; color: #1e293b; font-family: 'Inter', sans-serif; }
        .theme-1 .ch-header h1 { color: #0f172a; font-weight: 800; }
        .theme-1 .card { background: #f8fafc; border: 1px solid #e2e8f0; padding: 25px; border-radius: 8px; border-top: 4px solid #2563eb; }
        .theme-1 .highlight { color: #2563eb; }

        /* Theme 2: Dark Mode SaaS */
        .theme-2 { background: #0f172a; color: #cbd5e1; font-family: 'Inter', sans-serif; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8); }
        .theme-2 .ch-header h1 { color: #f8fafc; }
        .theme-2 .card { background: #1e293b; border: 1px solid #334155; padding: 25px; border-radius: 12px; }
        .theme-2 .highlight { color: #38bdf8; }

        /* Theme 3: Neumorphism */
        .theme-3 { background: #e0e5ec; color: #4a5568; font-family: 'Poppins', sans-serif; box-shadow: none; border: 1px solid #d1d9e6; }
        .theme-3 .card { background: #e0e5ec; padding: 25px; border-radius: 20px; box-shadow: 9px 9px 16px rgb(163,177,198,0.6), -9px -9px 16px rgba(255,255,255, 0.5); border: none; }
        .theme-3 .highlight { color: #d946ef; font-weight: 800; }

        /* Theme 4: Glassmorphism */
        .theme-4 { background: linear-gradient(135deg, #fce7f3 0%, #e0e7ff 100%); color: #1e1b4b; font-family: 'Poppins', sans-serif; }
        .theme-4 .card { background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.8); padding: 25px; border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1); }
        .theme-4 .highlight { color: #4f46e5; }

        /* Theme 5: Brutalism / Swiss */
        .theme-5 { background: #ffffff; color: #000000; font-family: 'Inter', sans-serif; border: 8px solid #000; border-radius: 0; box-shadow: 15px 15px 0 #000; }
        .theme-5 .ch-header h1 { font-size: 5rem; text-transform: uppercase; letter-spacing: -2px; border-bottom: 8px solid #000; padding-bottom: 20px; }
        .theme-5 .card { border: 4px solid #000; padding: 25px; border-radius: 0; background: #fff; }
        .theme-5 .card:nth-child(even) { background: #000; color: #fff; }
        .theme-5 .highlight { background: #fbbf24; color: #000; padding: 0 5px; }

        /* Theme 6: Elegant Editorial */
        .theme-6 { background: #fdfbf7; color: #27272a; font-family: 'Playfair Display', serif; }
        .theme-6 .ch-header h1 { font-size: 4rem; font-style: italic; border-bottom: 1px solid #d4d4d8; padding-bottom: 20px; }
        .theme-6 .card { background: transparent; border: none; border-left: 2px solid #27272a; padding: 15px 25px; border-radius: 0; }
        .theme-6 .card h3 { font-family: 'Inter', sans-serif; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 2px; }
        .theme-6 .highlight { color: #9f1239; font-style: italic; }

        /* Theme 7: Tech Terminal */
        .theme-7 { background: #000000; color: #4ade80; font-family: 'Roboto Mono', monospace; border-radius: 0; }
        .theme-7 .ch-header h1 { color: #4ade80; }
        .theme-7 .card { border: 1px solid #166534; padding: 25px; background: rgba(22, 101, 52, 0.2); border-radius: 0; }
        .theme-7 .highlight { color: #fff; background: #166534; padding: 2px 5px; }

        /* Theme 8: Vibrant Gradient */
        .theme-8 { background: linear-gradient(120deg, #84fab0 0%, #8fd3f4 100%); color: #083344; font-family: 'Poppins', sans-serif; border: none; }
        .theme-8 .card { background: #ffffff; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border: none; }
        .theme-8 .highlight { color: #0284c7; font-weight: bold; }

        /* Theme 9: Pastel Minimal */
        .theme-9 { background: #fefce8; color: #713f12; font-family: 'Inter', sans-serif; }
        .theme-9 .card { background: #fef3c7; border: none; padding: 30px; border-radius: 30px; }
        .theme-9 .card h3 { color: #a16207; }
        .theme-9 .highlight { color: #ea580c; }

        /* Theme 10: High Contrast Bold */
        .theme-10 { background: #18181b; color: #fafafa; font-family: 'Inter', sans-serif; }
        .theme-10 .ch-header h1 { font-weight: 900; font-size: 4.5rem; color: #facc15; }
        .theme-10 .card { background: #27272a; border-left: 8px solid #facc15; padding: 25px; border-radius: 0; }
        .theme-10 .highlight { color: #facc15; }

        /* Generic inner styles */
        .card h3 { margin-bottom: 15px; font-size: 1.3rem; font-weight: 600; }
        .card p { margin-bottom: 10px; font-size: 1.1rem; line-height: 1.6; }
        .card ul { padding-left: 20px; margin-bottom: 10px; }
        .card li { margin-bottom: 8px; font-size: 1.05rem; }
        
        .stat-block { text-align: center; }
        .stat-val { font-size: 3.5rem; font-weight: 800; line-height: 1; margin-bottom: 10px; }
        .stat-label { font-size: 1rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; }

        .hmw-box {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1.4;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>ReBox: 50 Professional Corporate Charts</h1>
        <p>Generated using 10 design systems × 5 architectural layouts = 50 distinct visual presentations.</p>
    </div>

    <div class="charts-container" id="charts-container">
        <!-- JS will inject 50 charts here -->
    </div>

    <script>
        // The core data for the charts
        const data = {
            title: "ReBox: Empathy & Define Phase",
            subtitle: "Team: Hari Charan V | Anjali | Supriya • Design Thinking Lab 2026",
            personas: [
                { title: "Shopper Persona", quote: "\"I prioritize a clean house over eco-guilt.\"", points: ["Needs zero-friction disposal", "Space constraints force rapid disposal", "Hoards boxes then uses dry waste bin"] },
                { title: "Vendor Persona", quote: "\"A box is a box. Brand doesn't matter.\"", points: ["Pays ₹20-35 per new box", "Packaging consumes 10-15% of margins", "Needs reliable local supply"] }
            ],
            stats: [
                { val: "80%", label: "Cite space as #1 pain" },
                { val: "96%", label: "Vendors brand neutral" },
                { val: "₹15-30", label: "Value Gap per Box" },
                { val: "90%+", label: "Willing to adopt" }
            ],
            whys: [
                "1. Residents throw in dry waste.",
                "2. Lack of space + no easy alternative.",
                "3. Kabadiwala visits are irregular.",
                "4. Kabadiwala sells by weight (pulping).",
                "ROOT: Ecosystem optimizes for recycling, not reuse."
            ],

            hmw: "How Might We intercept intact boxes at the apartment level and redirect them to local vendors who need them?"
        };

        const container = document.getElementById('charts-container');
        let chartCounter = 1;

        // Loop through 10 themes
        for (let t = 1; t <= 10; t++) {
            // Loop through 5 layouts
            for (let l = 1; l <= 5; l++) {
                
                const chartDiv = document.createElement('div');
                chartDiv.className = `chart theme-${t} layout-${l}`;
                
                chartDiv.innerHTML = `
                    <div class="chart-badge">CHART #${chartCounter} | THEME ${t} | LAYOUT ${l}</div>
                    
                    <div class="ch-header">
                        <h1>${data.title}</h1>
                        <p style="opacity: 0.8; margin-top: 10px;">${data.subtitle}</p>
                    </div>

                    <div class="ch-sidebar">
                        ${data.stats.map(s => `
                            <div class="card stat-block">
                                <div class="stat-val highlight">${s.val}</div>
                                <div class="stat-label">${s.label}</div>
                            </div>
                        `).join('')}
                    </div>

                    <div class="ch-main">
                        ${data.personas.map(p => `
                            <div class="card">
                                <h3>${p.title}</h3>
                                <p style="font-style: italic; margin-bottom: 15px;" class="highlight">${p.quote}</p>
                                <ul>${p.points.map(pt => `<li>${pt}</li>`).join('')}</ul>
                            </div>
                        `).join('')}

                        <div class="card">
                            <h3>Root Cause (5 Whys)</h3>
                            <ul>${data.whys.map((w, i) => i === 4 ? `<li><strong class="highlight">${w}</strong></li>` : `<li>${w}</li>`).join('')}</ul>
                        </div>


                    </div>

                    <div class="ch-full">
                        <div class="card hmw-box" style="border: none; background: rgba(0,0,0,0.05);">
                            <span class="highlight">HMW:</span> "${data.hmw}"
                        </div>
                    </div>
                `;

                container.appendChild(chartDiv);
                chartCounter++;
            }
        }
    </script>
</body>
</html>
